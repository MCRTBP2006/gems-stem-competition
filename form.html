</head>
<body>
    <div class="header">
        <h1>Health form</h1>
    </div>
    <div class="form">
        <form>
            <p class="question">Are you?</p>
            <input class="fbutton" type="button" value="Yes" id="test" name="test">
            <input class="fbutton" type="button" value="Probably" id="test" name="test">
            <input class="fbutton" type="button" value="I don't know" id="test" name="test">
            <input class="fbutton" type="button" value="Probably Not" id="test" name="test">
            <input class="fbutton" type="button" value="No" id="test" name="test">            
        </form>
    </div>
</body>
