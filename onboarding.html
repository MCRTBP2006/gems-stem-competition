<!DOCTYPE html>
<html>

<head lang="en">
    <title>OnBoarding</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <h1>Please complete the onboarding</h1>
        <form>
            <label for="fname">Name</label><br>
            <input type="text" id="name" name="name" required value=""><br>
            <label for="dob">Date of Birth</label><br>
            <input type="date" id="dob" name="dob" required value=""><br>
            <label for="gender">Gender</label><br>
            <select id="gender" name="Gender" required>
                <option value="" disabled selected hidden></option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <br>
            <label for="height">Height</label><br>
            <input type="number" required step="any" min="1" id="height" name="height" value=""><br>
            <label for="weight">Weight</label><br>
            <input type="number" required step="any" min="1" id="weight" name="weight" value=""><br>
            <label for="PNum">Phone Number</label><br>
            <input type="text" required id="PNum" name="height" value=""><br>
            <label for="email">Email Address</label><br>
            <input type="text" required id="email" name="email" value=""><br>
            <label for="allergies">Any Allergies</label><br>
            <input type="text" required id="allergies" name="allergies" value=""><br>
            <label for="other">Anything else you would like to mention.</label><br>
            <input type="text" required id="other" name="other" value=""><br>


            <br>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>

</html>
