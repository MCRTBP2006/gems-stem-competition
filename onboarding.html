<!DOCTYPE html>
<html>

<head lang="en">
    <title>Onboarding</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header-onboarding"><h1>Please complete the onboarding</h1></div>
    <div class="main-onboarding">
        <form>
            <label for="fname">Name</label><br>
            <input class="form-button" type="text" id="name" name="name"  value=""><br>
            <label for="dob">Date of Birth</label><br>
            <input class="form-button" type="date" id="dob" name="dob"  value=""><br>
            <label for="gender">Gender</label><br>
            <select class="form-button" id="gender" name="Gender" >
                <option value="" disabled selected hidden></option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <br>
            <label for="height">Height (cm)</label><br>
            <input class="form-button" type="number"  step="any" min="1" id="height" name="height" value=""><br>
            <label for="weight">Weight (kg)</label><br>
            <input class="form-button" type="number"  step="any" min="1" id="weight" name="weight" value=""><br>
            <label for="PNum">Phone Number</label><br>
            <input class="form-button" type="text"  id="PNum" name="height" value=""><br>
            <label for="email">Email Address</label><br>
            <input class="form-button" type="text"  id="email" name="email" value=""><br>
            <label for="allergies">Any Allergies</label><br>
            <input class="form-button" type="text"  id="allergies" name="allergies" value=""><br>
            <label for="other">Anything else you would like to mention.</label><br>
            <input class="form-button" type="text"  id="other" name="other" value=""><br>


            <br>
            <!-- <input type="submit" value="Submit"> -->
            <a href="form.html" class="onboarding-button">Submit</a>
        </form>
    </div>
</body>

</html>
